name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analysis-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/analysis-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: |
          python -m pip install "uv==0.12.13"
          uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Check formatting
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run python -m unittest discover -s tests -v
      - name: Audit dependencies
        run: uv run pip-audit

  desktop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable locked package manager
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --dir apps/desktop lint
      - name: Test
        run: pnpm --dir apps/desktop test
      - name: Type check and build
        run: pnpm --dir apps/desktop build
      - name: Audit dependencies
        run: pnpm audit --audit-level high
