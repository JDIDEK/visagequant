[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visagequant-engine"
version = "0.1.0"
description = "Local, deterministic facial morphometry engine"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
ml = [
  "onnxruntime-gpu>=1.20,<2; platform_system != 'Darwin'",
]

[project.scripts]
visagequant = "visagequant_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visagequant_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-q --cov=visagequant_engine --cov-report=term-missing"
testpaths = ["tests"]
